<text x="30" y="96" font-size="15" clip-path="url(#c0)"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text><text x="30" y="126" font-size="15" clip-path="url(#c1)"><tspan fill="#8b98a5">Eslam Mustafa (LeaDer-E) · Alexandria, Egypt · Storia Kids Co.</tspan></text><text x="30" y="156" font-size="15" clip-path="url(#c2)"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">cat about.txt</tspan></text><text x="30" y="186" font-size="15" clip-path="url(#c3)"><tspan fill="#8b98a5">Coding started as a hobby. It turned into a habit:</tspan></text><text x="30" y="216" font-size="15" clip-path="url(#c4)"><tspan fill="#8b98a5">automate everything repetitive, on Windows and Linux.</tspan></text><text x="30" y="246" font-size="15" clip-path="url(#c5)"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">ls focus/</tspan></text><text x="30" y="276" font-size="15" clip-path="url(#c6)"><tspan fill="#22d3ee">automation/  hardware-input/  bilingual-tools/  career-tech/</tspan></text><text x="30" y="306" font-size="15" clip-path="url(#c7)"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">echo $MOTTO</tspan></text><text x="30" y="336" font-size="15" clip-path="url(#c8)"><tspan fill="#8b98a5">&quot;Everything you see here is just for practicing my hobby&quot;</tspan></text><text x="30" y="363" font-size="15" fill="#34d399" opacity="0">$<animate attributeName="opacity" from="0" to="1" begin="7.85s" dur="0.01s" fill="freeze"/></text><rect x="48" y="348" width="9" height="18" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="7.85s" repeatCount="indefinite"/></rect>
